[package]
name = "cybercalls"
version = "0.1.0"
edition = "2024"

[features]
default = ["gpu"]
# Whisper on the GPU through Vulkan (needs the Vulkan SDK to build)
gpu = ["whisper-rs/vulkan"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
env_logger = "0.11.11"
glyphon = "0.12.0"
log = "0.4.34"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
wgpu = "30.0.1"
whisper-rs = "0.16.0"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
